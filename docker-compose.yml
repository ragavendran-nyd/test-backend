version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpass

      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    ports:
      - "8080:8080"
    volumes:
      - ./disable-ssl.sh:/opt/app/disable-ssl.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f --silent http://localhost:8080/realms/master || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  keycloak-fix:
    image: quay.io/keycloak/keycloak:21.1.1
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    entrypoint: ["/bin/bash", "-c"]
    command: |
      echo "wait for keycloak api...";
      until curl -sSf http://keycloak:8080/realms/master >/dev/null 2>&1; do sleep 3; done;
      echo "keycloak reachable; configuring admin...";
      /opt/keycloak/bin/kcadm.sh config credentials --server http://keycloak:8080 --realm master --user ${KEYCLOAK_ADMIN} --password ${KEYCLOAK_ADMIN_PASSWORD};
      /opt/keycloak/bin/kcadm.sh update realms/master -s sslRequired=NONE || true;
      echo "sslRequired set to NONE (or already set)";
    restart: "no"

  vault:
    image: hashicorp/vault:1.17.3
    container_name: vault
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
    volumes:
      - vaultdata:/vault/data
      - ./vault.hcl:/vault/config/vault.hcl:ro
    command: server -config=/vault/config/vault.hcl
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sS http://127.0.0.1:8200/v1/sys/health | grep -q 'initialized' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  vaultdata:

networks:
  default:
    driver: bridge
