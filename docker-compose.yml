services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpass

      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_SPI_HOSTNAME_DEFAULT_HTTPS_REQUIRED: "false"

    volumes:
      - /opt/app/disable-ssl.sh:/opt/keycloak/disable-ssl.sh

    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Starting Keycloak..."
        /opt/keycloak/bin/kc.sh start-dev &

        echo "Running disable-ssl script..."
        chmod +x /opt/keycloak/disable-ssl.sh
        bash /opt/keycloak/disable-ssl.sh

        wait

    ports:
      - "8080:8080"

    depends_on:
      - postgres

  vault:
    image: hashicorp/vault:1.16
    container_name: vault
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_LOCAL_CONFIG: |
        {
          "ui": true
        }
    volumes:
      - vaultdata:/vault
    command: server -config=/vault/vault.hcl

volumes:
  pgdata:
  vaultdata:
