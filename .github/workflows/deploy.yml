name: Run Backend with LocalStack

on:
  push:
    branches: [develop-testing]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack
        ports:
          - 4566:4566
        env:
          SERVICES: s3,lambda,dynamodb
          DEBUG: 1
        options: >-
          --health-cmd="curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -t backend-app .

      - name: Run backend container
        run: |
          docker run -d --name backend -p 8000:8000 \
            --env AWS_ACCESS_KEY_ID=test \
            --env AWS_SECRET_ACCESS_KEY=test \
            --env AWS_DEFAULT_REGION=ap-southeast-1 \
            --env LOCALSTACK_URL=http://localstack:4566 \
            --network host backend-app

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to start..."
          for i in {1..15}; do
            if curl -sSf http://localhost:8000/docs > /dev/null; then
              echo "✅ Backend is up!"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Backend did not start in time" && exit 1
