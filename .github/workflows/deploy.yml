name: Terraform Deploy with LocalStack

on:
  push:
    branches: ["willcloud-ec2-localstack-test"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run LocalStack in background
        run: |
          docker run -d --name localstack \
            -p 4566:4566 \
            -e SERVICES="ec2,iam,s3,sts,cloudwatch,logs" \
            -e DEBUG=1 \
            localstack/localstack:latest
          sleep 15

      - name: Verify LocalStack is running
        run: curl http://localhost:4566/health

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Stop LocalStack
        run: docker stop localstack
